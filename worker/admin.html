align-items:center;flex-wrap:wrap;margin-bottom:18px}.field,.search,.select,textarea{border:1px solid #e1e1e7;background:#fff;border-radius:8px;padding:11px 12px;color:#292932;outline:none}.field:focus,.search:focus,.select:focus,textarea:focus{border-color:#8d80ef;box-shadow:0 0 0 3px #eeebff}.search{min-width:230px;flex:1}.select{min-width:140px}.gridcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.entity{border:1px solid #ececf0;background:#fff;border-radius:12px;padding:18px;text-align:left;color:inherit;transition:border-color .15s,transform .15s}.entity:hover{border-color:#c7c0ff;transform:translateY(-2px)}.entity-top{display:flex;align-items:center;gap:12px}.entity-icon{height:44px;width:44px;border-radius:10px;display:grid;place-items:center;background:#f0edff;color:#5a48ea;font-weight:850;font-size:17px;flex:none}.entity h3{font-size:13px;margin:0 0 3px;overflow-wrap:anywhere}.entity p{color:#9999a3;font-size:11px;margin:0}.entity-bottom{margin-top:20px;display:flex;justify-content:space-between;align-items:end;gap:8px}.entity-bottom b{font-size:16px}.empty{padding:45px 20px;text-align:center;color:#9999a3;font-size:12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .wide{grid-column:1/-1}.form-label{display:grid;gap:6px;color:#666672;font-weight:650;font-size:11px}.form-label input,.form-label select,.form-label textarea{width:100%}.check{display:flex;gap:8px;align-items:center;color:#666672;font-size:12px}.notice{font-size:12px;color:#6b6680;background:#f4f2ff;border:1px solid #e5e0ff;padding:13px 15px;border-radius:8px;line-height:1.6}.warn{background:#fff8eb;border-color:#f4e2bb;color:#8b6a33}.drawer-bg{position:fixed;inset:0;background:rgba(16,16,23,.45);z-index:30;display:flex;justify-content:flex-end}.drawer{width:min(580px,100%);height:100%;background:#fff;overflow-y:auto;box-shadow:-10px 0 35px #10101720;padding:28px}.drawer-head{display:flex;justify-content:space-between;align-items:start;gap:1 <section id="login" class="login-screen" hidden><div class="login-card"><div class="logo">BIORY<em>X</em></div><div class="eyebrow" style="margin-top:10px">STORE MANAGEMENT / 01</div><h1>С возвращением.</h1><p>Войдите в панель управления магазином.</p><form id="login-form"><label>ПАРОЛЬ АДМИНИСТРАТОРА<input id="password" class="field" type="password" autocomplete="current-password" required placeholder="Введите пароль"></label><button class="primary" type="submit">Войти в кабинет ↗</button></form><p id="login-error" class="error" role="alert"></p></div></section>
<div id="app" class="app" hidden><div id="backdrop" class="sidebar-backdrop"></div><aside id="sidebar" class="side"><div class="brand"><div class="logo">BIORY<em>X</em></div><small>STORE MANAGEMENT</small></div><div class="side-label">РАБОЧЕЕ ПРОСТРАНСТВО</div><nav class="nav" aria-label="Разделы панели"><button data-nav="overview"><span class="nav-icon">◫</span>Обзор</button><button data-nav="orders"><span class="nav-icon">▤</span>Заказы</button><button data-nav="products"><span class="nav-icon">◇</span>Товары и склад</button><button data-nav="customers"><span class="nav-icon">♙</span>Клиенты</button><button data-nav="promotions"><span class="nav-icon">%</span>Промокоды и акции</button><button data-nav="analytics"><span class="nav-icon">▥</span>Анализ продаж</button><button data-nav="club"><span class="nav-icon">✦</span>Клуб и баллы</button><button data-nav="finance"><span class="nav-icon">₽</span>Денежные операции</button><button data-nav="reports"><span class="nav-icon">▧</span>Отчёты</button><button data-nav="mailing"><span class="nav-icon">✉</span>Рассылка</button><button data-nav="exports"><span class="nav-icon">⇩</span>Выгрузка данных</button></nav><div class="side-foot"><div><span class="status-dot"></span>Панель управления</div><p>BIORYX / 2026<br><span class="online">СИСТЕМА ДЛЯ СВОИХ</span></p></div></aside><div class="main"><header class="top"><div class="top-left"><button id="mobile-nav" class="outline mobile-toggle" aria-label="Открыть меню">☰</button><div class="breadcrumb">BIORYX <span style="padding:0 8px">/</span> <b id="crumb">Обзор</b></div></div><div class="top-actions"><button id="refresh" class="outline" title="Обновить данные">↻ <span class="refresh-text">Обновить</span></button><div class="avatar" title="Администратор">A</div><button id="logout" class="ghost">Выйти ↗</button></div></header><main class="content" id="content" aria-live="polite"></main></div></div>
<div id="drawer-bg" class="drawer-bg" hidden><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-head"><div><div class="eyebrow" id="drawer-kicker">BIORYX / ДЕТАЛИ</div><h2 id="drawer-title"></h2></div><button id="close-drawer" class="close" aria-label="Закрыть">×</button></div><div id="drawer-content"></div></section></div><div id="toast" class="toast" role="status" hidden></div>
<script src="/admin/xlsx.js"></script><script>
const $=id=>document.getElementById(id), E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>new Intl.NumberFormat('ru-RU').format(Number(x)||0)+' ₽', number=x=>new Intl.NumberFormat('ru-RU').format(Number(x)||0),short=x=>String(x||'').slice(0,8).toUpperCase();
const names={overview:'Обзор',orders:'Заказы',products:'Товары и склад',customers:'Клиенты',mailing:'Рассылка',exports:'Выгрузка данных',promotions:'Промокоды и акции',analytics:'Анализ продаж',club:'Клуб и баллы',reports:'Отчёты',finance:'Денежные операции'};
const statuses={new:'Новый',confirmed:'Подтверждён',packing:'Собирается',sent:'Отправлен',delivered:'Доставлен',cancelled:'Отменён'};
const colors={new:'purple',confirmed:'orange',packing:'orange',sent:'purple',delivered:'green',cancelled:'gray'};
const levels=(n,manual)=>{let a=state.club?.levels||[];return (a.find(x=>x.id===manual)||[...a].reverse().find(x=>Number(n)>=x.threshold))?.title||'—'};
let state={view:'overview',orders:[],products:[],customers:[],promos:[],summary:null,query:'',filter:'all'},openId=null,currentOrderStatus=null,toastTimer;
const badge=(label,color='gray')=>`<span class="badge ${E(color)}">${E(label)}</span>`;
function notify(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4000)}
async function api(path,method='GET',body){let options={method,headers:{'content-type':'application/json'}};if(body!==undefined)options.body=JSON.stringify(body);const r=await fetch('/admin/api/'+path,options);let data;try{data=await r.json()}catch{throw Error('Сервер вернул некорректный ответ')}if(!r.ok)throw Error(data.error||'Ошибка запроса');return data}
function title(t,subtitle,button=''){return `<div class="welcome"><div><div class="eyebrow">BIORYX / УПРАВЛЕНИЕ МАГАЗИНОМ</div><h1 class="heading">${E(t)}</h1><p class="sub">${E(subtitle)}</p></div>${button||'<div class="date">'+E(new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(new Date()))+'</div>'}</div>`}
function metric(label,value,detail,icon,accent=false){return `<div class="metric"><div class="metric-head">${E(label)}<span class="metric-icon">${icon}</span></div><strong>${E(value)}</strong><small class="${accent?'accent':''}">${E(detail)}</small></div>`}
function orderTable(list){if(!list.length)return '<div class="empty">Заказов пока нет или ничего не найдено.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Заказ</th><th>Покупатель</th><th>Дата</th><th>Статус</th><th>Оплата</th><th>Сумма товаров</th><th></th></tr></thead><tbody>${list.map(o=>`<tr class="clickable" data-action="order" data-id="${E(o.id)}"><td class="id">#${E(short(o.id))}</td><td class="person">${E(o.customer_name||'Покупатель')}</td><td class="dim">${E((o.created_at||'').slice(0,16))}</td><td>${badge(statuses[o.status]||o.status,colors[o.status]||'gray')}</td><td>${badge(o.payment_status==='paid'?'Подтверждена':'Не подтверждена',o.payment_status==='paid'?'green':'orange')}</td><td><b>${E(money(o.total))}</b></td><td class="dim">↗</td></tr>`).join('')}</tbody></table></div>`}
async function loadAll(){const [summary,orders,products,customers,promos,club,sales]=await Promise.all([api('summary'),api('orders'),api('products'),api('customers'),api('promos'),api('club-settings'),api('club-sales')]);state.club=club;state.clubSales=sales.sales||[];state.summary=summary;state.orders=orders.orders||[];state.products=products.products||[];state.customers=customers.customers||[];state.promos=promos.promos||[]}
function overview(){let s=state.summary,o=s.orders,p=s.products,c=s.customers,low=state.products.filter(x=>x.active&&x.stock<=5).sort((a,b)=>a.stock-b.stock).slice(0,5);let days=[];for(let i=6;i>=0;i--){const d=new Date();d.setUTCHours(0,0,0,0);d.setUTCDate(d.getUTCDate()-i);const key=d.toISOString().slice(0,10);days.push({key,label:key.slice(8)+'/'+key.slice(5,7),count:Number((s.days||[]).find(x=>x.day===key)?.orders||0)})}const max=Math.max(1,...days.map(x=>x.count));return title('Обзор магазина','Всё важное о вашем магазине — в одном месте.')+`<div class="metrics">${metric('Всего заказов',number(o.total),'За всё время','▤')}${metric('Новые заказы',number(o.new_orders),'Требуют внимания','◷',true)}${metric('Оплачено за товары',money(o.paid_goods),'Кроме отменённых заказов','₽')}${metric('Клиенты',number(c.total),'Зарегистрированы в боте','♙')}</div><div class="grid2"><section class="card"><div class="card-head"><div><h2 class="card-title">Динамика заказов</h2><p class="card-note">За последние 7 дней · даты UTC</p></div>${badge('7 ДНЕЙ','purple')}</div><div class="chart">${days.map(d=>`<div class="chart-col" title="${E(d.key)}: ${d.count}"><span class="muted">${d.count}</span><div class="bar" style="height:${Math.max(3,d.count/max*125)}px"></div><span class="chart-label">${E(d.label)}</span></div>`).join('')}</div></section><section class="card"><div class="card-head"><div><h2 class="card-title">Контроль остатков</h2><p class="card-note">Товары, которые стоит проверить</p></div><button class="link" data-go="products">На склад ↗</button></div><div class="stock-list">${low.length?low.map(x=>`<div class="stock-row"><div class="stock-icon">${E((x.name||'X').slice(0,1))}</div><div class="stock-info"><strong>${E(x.name)}</strong><small>${E(x.sku||x.id)}</small></div>${badge(x.stock===0?'Нет в наличии':x.stock+' шт.',x.stock===0?'red':'orange')}</div>`).join(''):'<div class="empty">Нет товаров с низким остатком.</div>'}</div></section></div><section class="card section-card"><div class="card-head"><div><h2 class="card-title">Последние заказы</h2><p class="card-note">Нажмите на заказ, чтобы открыть карточку</p></div><button class="link" data-go="orders">Все заказы ↗</button></div>${orderTable(state.orders.slice(0,6))}</section>`}

let productImportRows=null,productImportExpected=null,productImportVersion=0;
const IMPORT_HEADERS={'id':'id','id товара':'id','код товара':'id','артикул':'sku','sku':'sku','название':'name','название товара':'name','name':'name','категория':'category','category':'category','описание':'description','description':'description','цена':'price','цена руб':'price','price':'price','остаток':'stock','остаток шт':'stock','stock':'stock','изображение':'image','image':'image','активен':'active','активность':'active','active':'active','себестоимость':'unit_cost','unit_cost':'unit_cost'};
const IMPORT_FIELDS={sku:'Артикул',name:'Название',category:'Категория',description:'Описание',price:'Цена',stock:'Остаток',image:'Изображение',active:'Активен',unit_cost:'Себестоимость'};
function importValue(key,v,line){let text=String(v??'').trim();if(text==='')return undefined;if(text.startsWith('='))throw Error('Строка '+line+': формулы в файле не допускаются.');if(['price','stock','unit_cost'].includes(key)){text=text.replace(/[\s\u00a0\u202f]/g,'').replace(/₽/g,'');if(!/^\d+$/.test(text))throw Error('Строка '+line+': '+IMPORT_FIELDS[key]+' — целое число без копеек.');const n=Number(text);if(!Number.isSafeInteger(n))throw Error('Строка '+line+': слишком большое число.');return n}if(key==='active'){const val=text.toLowerCase();if(['1','да','включен','включён','активен','yes','true'].includes(val))return 1;if(['0','нет','выключен','выключён','скрыт','no','false'].includes(val))return 0;throw Error('Строка '+line+': «Активен» — 1 или 0.')}if(key==='category'){const value=text.toLowerCase();return ({'протеин':'protein','протеины':'protein','protein':'protein','креатин':'creatine','креатины':'creatine','creatine':'creatine','набор':'sets','наборы':'sets','комплект':'sets','sets':'sets'})[value]||value}return text}
async function parseProductFile(file){
 if(!file)throw Error('Выберите файл.');if(file.size>3*1024*1024)throw Error('Файл больше 3 МБ. Разделите его на части.');if(!/\.(xlsx|csv)$/i.test(file.name))throw Error('Поддерживаются только .xlsx и .csv.');if(typeof XLSX==='undefined')throw Error('Модуль Excel не загрузился. Обновите панель и проверьте публикацию Worker.');
 const buf=await file.arrayBuffer();let workbook;if(/\.csv$/i.test(file.name)){const bytes=new Uint8Array(buf);let text;if(bytes[0]===0xff&&bytes[1]===0xfe)text=new TextDecoder('utf-16le').decode(bytes);else if(bytes[0]===0xfe&&bytes[1]===0xff)text=new TextDecoder('utf-16be').decode(bytes);else{try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch{text=new TextDecoder('windows-1251').decode(bytes)}}workbook=XLSX.read(text,{type:'string',raw:true})}else workbook=XLSX.read(buf,{type:'array',cellFormula:true,cellDates:false});
 if(!workbook.SheetNames.length)throw Error('В файле нет листов.');const sheet=workbook.Sheets[workbook.SheetNames[0]];if(!sheet['!ref'])throw Error('Файл пуст.');const range=XLSX.utils.decode_range(sheet['!ref']);if(range.e.r>1000||range.e.c>50)throw Error('Слишком много строк или столбцов. Максимум 500 товаров и 50 столбцов.');for(const [key,cell] of Object.entries(sheet))if(key[0]!=='!'&&cell?.f)throw Error('Формулы не поддерживаются. В Excel замените их значениями и загрузите файл заново.');
 const table=XLSX.utils.sheet_to_json(sheet,{header:1,raw:true,defval:'',blankrows:false});if(table.length<2)throw Error('Нужны заголовки и хотя бы одна строка товара.');const keys=table[0].map(x=>IMPORT_HEADERS[String(x??'').replace(/^\ufeff/,'').trim().toLowerCase()]||'');const used=keys.filter(Boolean);if(!used.includes('id'))throw Error('Добавьте столбец «ID товара».');if(used.length!==new Set(used).size)throw Error('Повторяются столбцы: оставьте только один столбец каждого типа.');const unknown=table[0].map((x,i)=>String(x??'').trim()&&!keys[i]?String(x).trim():'').filter(Boolean);if(unknown.length)throw Error('Неизвестные столбцы: '+unknown.join(', ')+'. Используйте шаблон.');
 const rows=[];for(let i=1;i<table.length;i++){const cells=table[i];if(!cells.some(x=>String(x??'').trim()))continue;let obj={};for(let j=0;j<keys.length;j++){if(!keys[j])continue;const value=importValue(keys[j],cells[j],i+1);if(value!==undefined)obj[keys[j]]=value}rows.push(obj)}if(!rows.length||rows.length>500)throw Error('Нужно от 1 до 500 товаров в файле.');return rows;
}
async function importApi(mode,rows,expected){const r=await fetch('/admin/api/products-import',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode,rows,expected})});let d;try{d=await r.json()}catch{throw Error('Некорректный ответ сервера.')}if(!r.ok)throw Error((d.error||'Ошибка импорта')+(d.errors?.length?'\n'+d.errors.join('\n'):''));return d}
function importFieldValue(v){return v===null||v===undefined?'—':String(v)}
function importPreviewMarkup(data,rows){const table=data.items.map((x,i)=>{const edits=Object.keys(rows[i]).filter(k=>k!=='id').map(k=>`${E(IMPORT_FIELDS[k]||k)}: ${E(importFieldValue(x.before?.[k]))} → <b>${E(importFieldValue(x.after[k]))}</b>`).join('<br>');return `<tr><td><b>${E(x.id)}</b><br><span class="muted">${x.isNew?'Новый':'Уже есть'}</span></td><td>${E(x.after.name||'—')}</td><td>${edits||'Без изменений'}</td></tr>`}).join('');return `<div class="notice">К созданию: <b>${data.newCount}</b> · к обновлению: <b>${data.updatedCount}</b>. Пустые ячейки не изменяют существующие значения. Перед применением проверьте цены и остатки.</div><div class="table-wrap" style="max-height:430px;overflow:auto;margin-top:14px"><table class="table"><thead><tr><th>ID</th><th>ТОВАР</th><th>ЗНАЧЕНИЯ: БЫЛО → СТАНЕТ</th></tr></thead><tbody>${table}</tbody></table></div>`}
function bindProductImport(){const file=$('product-import-file'),preview=$('product-import-preview'),apply=$('product-import-apply'),out=$('product-import-result');if(!file)return;file.onchange=()=>{productImportVersion++;productImportRows=null;apply.disabled=true;out.textContent='Файл выбран. Нажмите «Проверить файл».'};$('product-import-template').onclick=()=>{const csv='\ufeffID товара;Артикул;Название;Категория;Описание;Цена;Остаток;Изображение;Активен;Себестоимость\r\n';const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='bioryx-shablon-tovarov.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};
 preview.onclick=async()=>{const version=++productImportVersion;productImportRows=null;apply.disabled=true;preview.disabled=true;out.textContent='Читаем и проверяем файл…';try{const rows=await parseProductFile(file.files[0]),data=await importApi('preview',rows);if(version!==productImportVersion)return;productImportRows=rows;productImportExpected=data.items.map(x=>({id:x.id,exists:!x.isNew,stock:x.before?.stock??null}));out.innerHTML=importPreviewMarkup(data,rows);apply.disabled=false}catch(e){if(version===productImportVersion)out.textContent=e.message||'Не удалось проверить файл.'}finally{preview.disabled=false}};
 apply.onclick=async()=>{if(!productImportRows)return;if(!confirm('Обновить каталог и остатки по проверенному файлу? Остатки из файла заменят текущие значения.'))return;const rows=productImportRows;apply.disabled=true;preview.disabled=true;out.textContent='Применяем изменения…';try{const d=await importApi('commit',rows,productImportExpected);productImportRows=null;await reload();notify('Импорт выполнен: '+d.count+' товаров')}catch(e){productImportRows=null;out.textContent=(e.message||'Ошибка импорта.')+'\nЕсли соединение прервалось, обновите страницу и проверьте товары перед повтором.'}finally{preview.disabled=false}};
}

rch" placeholder="⌕  Поиск по названию или артикулу" value="${E(state.query)}"><select id="filter" class="select"><option value="all">Все товары</option><option value="low" ${state.filter==='low'?'selected':''}>Мало на складе</option><option value="zero" ${state.filter==='zero'?'selected':''}>Нет в наличии</option><option value="hidden" ${state.filter==='hidden'?'selected':''}>Скрытые</option></select><span class="toolbar-label">Показано: ${list.length}</span></div><div class="gridcards">${list.map(p=>`<button class="entity" data-action="product" data-id="${E(p.id)}"><div class="entity-top"><div class="entity-icon">${E((p.name||'X').slice(0,1))}</div><div><h3>${E(p.name)}</h3><p>${E(p.sku||p.id)}</p></div></div><div class="entity-bottom"><div><p>Цена товара</p><b>${E(money(p.price))}</b></div>${badge(!p.active?'Скрыт':p.stock===0?'Нет в наличии':p.stock<=5?'Осталось '+p.stock:'В наличии: '+p.stock,!p.active?'gray':p.stock===0?'red':p.stock<=5?'orange':'green')}</div></button>`).join('')||'<div class="empty">Товары не найдены.</div>'}</div><p class="muted">Показано до 500 товаров. Нажмите на карточку, чтобы редактировать.</p>`}

function promotionsView(){return title('Промокоды и акции','Промокоды на скидки с гибкими ограничениями.', '<button class="outline" data-action="audit" data-module="promo">История изменений ↗</button>')+`<div class="notice warn" style="margin-bottom:16px">Можно настроить скидку в процентах или рублях, подарок либо сочетание скидки и подарка. Бесплатная доставка доступна для выбранных способов получения; доступ можно ограничить уровнями клуба.</div><section class="card"><div class="card-head"><div><h2 class="card-title">Создать промокод</h2><p class="card-note">Скидка применяется к товарам</p></div><span class="metric-icon">%</span></div><form id="promo-form" class="stack"><label class="form-label">ПРОМОКОД<input class="field" name="code" placeholder="BIORYX10" maxlength="40" required></label><label class="form-label">НАЗВАНИЕ АКЦИИ<input class="field" name="title" placeholder="Название акции" maxlength="100" required></label><label class="form-label">ТИП СКИДКИ<select class="select" name="discountType"><option value="percent">Проценты</option><option value="fixed">Фиксированная сумма, ₽</option><option value="gift">Без скидки: подарок и/или доставка</option></select></label><label class="form-label">РАЗМЕР СКИДКИ (% ИЛИ ₽; для подарка игнорируется)<input class="field" name="discountValue" type="number" min="1" max="10000000" step="1" required value="1" placeholder="10"></label><div class="form-grid"><label class="form-label">НАЧАЛО (UTC, включительно)<input class="field" name="startDate" type="date"></label><label class="form-label">ОКОНЧАНИЕ (UTC, включительно)<input class="field" name="endDate" type="date"></label><label class="form-label">МИНИМУМ ТОВАРОВ, ₽<input class="field" name="minGoods" type="number" min="0" max="10000000" step="1" value="0" required></label><label class="form-label">ЛИМИТ ПРИМЕНЕНИЙ<input class="field" name="maxUses" type="number" min="0" max="10000000" step="1" value="0" required></label></div><div class="detail-block"><h3>Дополнительные условия</h3><div class="stack"><label class="check"><input name="requireLogin" type="checkbox"> Только после входа через Telegram</label><label class="check"><input name="firstOnly" type="checkbox"> Только первый привязанный заказ клиента</label><label class="form-label">МАКСИМУМ ПРИМЕНЕНИЙ ОДНИМ КЛИЕНТОМ<input class="field" name="maxPerCustomer" type="number" min="0" max="10000000" value="0" required></label><label class="form-label">ОБЯЗАТЕЛЬНЫЙ ТОВАР В КОРЗИНЕ<select class="select" name="requiredProduct"><option value="">Не требуется</option>${state.products.map(p=>`<option value="${E(p.id)}">${E(p.name)}</option>`).join('')}</select></label><label class="form-label">МИНИМАЛЬНОЕ КОЛИЧЕСТВО ОБЯЗАТЕЛЬНОГО ТОВАРА<input class="field" name="minQty" type="number" min="1" max="20" value="1" required></label></div><p class="muted">0 — без персонального лимита. Первый привязанный заказ учитывает и ранее отменённые привязанные заказы; гостевые заказы определить нельзя. Персональный лимит также считает отменённые заказы. Лимит и условие первого заказа требуют входа через Telegram. Подарки не считаются обязательным товаром.</p></div><div class="detail-block"><h3>Кому доступна акция</h3><p class="muted">Если ни один уровень не выбран — акция публичная. Если уровни выбраны — промокод доступен только вошедшим покупателям выбранных уровней, включая вручную установленные. Более высокий уровень не включается автоматически.</p><div class="stack">${(state.club?.levels||[]).map(l=>`<label class="check"><input type="checkbox" name="allowedLevel" value="${E(l.id)}"> ${E(l.title)}</label>`).join('')}</div></div><div class="detail-block"><h3>Подарок по промокоду</h3><div class="form-grid"><label class="form-label wide">ТОВАР ИЗ КАТАЛОГА<select class="select" name="giftProduct"><option value="">Без товара</option>${state.products.map(p=>`<option value="${E(p.id)}">${E(p.name)} · остаток ${E(p.stock)}${p.active?'':' · скрыт'}</option>`).join('')}</select></label><label class="form-label">КОЛИЧЕСТВО<input class="field" name="giftQty" type="number" min="1" max="20" value="1" required></label><label class="form-label wide">ДРУГОЙ ПОДАРОК / ОПИСАНИЕ<input class="field" name="giftDescription" maxlength="200" placeholder="Например, фирменная открытка"></label></div><p class="muted">Товар резервируется со склада при создании заказа. Подарок с описанием не учитывается на складе. Можно заполнить оба поля. Для акции без скидки нужен подарок и/или бесплатная доставка.</p></div><div class="detail-block"><h3>Бесплатная доставка</h3><label class="form-label">ДОСТУПНЫЕ СПОСОБЫ<select name="shipping" class="select"><option value="">Нет бесплатной доставки</option><option value="courier">Курьер по Грозному</option><option value="cdek">СДЭК</option><option value="both">Курьер и СДЭК</option></select></label><p class="muted">Стоимость доставки в магазине устанавливается вручную. Это обязательство не добавлять её покупателю. Самовывоз не является доставкой. Если способ не подходит, подарок или скидка сохраняются; для акции только на доставку промокод не применится.</p></div><p class="muted">0 означает без ограничения. Минимум считается до скидок и баллов, без доставки. Применение учитывается навсегда, даже при отмене. Даты — UTC, полностью включены.</p><button class="primary">Сохранить акцию</button></form></section><section class="card section-card"><div class="card-head"><div><h2 class="card-title">Акции магазина</h2><p class="card-note">Публичные видны всем, закрытые — только клиентам выбранных уровней</p></div></div>${state.promos.length?state.promos.map(p=>`<div class="stock-row"><div class="stock-icon">%</div><div class="stock-info"><strong>${E(p.title)}</strong><small>${E(p.code)} · ${p.no_discount?'подарок':p.fixed_amount?E(p.fixed_amount)+' ₽':E(p.percent)+'%'} · от ${E(p.min_goods||0)} ₽${p.gift_product_name?' · 🎁 '+E(p.gift_product_name)+' × '+E(p.gift_qty):''}${p.gift_description?' · 🎁 '+E(p.gift_description):''}${p.shipping_methods?' · Бесплатная доставка: '+E(({courier:'курьер',cdek:'СДЭК',both:'курьер / СДЭК'})[p.shipping_methods]):''} · ${p.allowed_levels?'Закрыта: '+E(p.allowed_levels.split(',').map(id=>(state.club?.levels||[]).find(x=>x.id===id)?.title||id).join(', ')):'Публичная'}${p.require_login?' · нужен вход':''}${p.first_linked_order?' · первый привязанный заказ':''}${p.max_per_customer?' · лимит на клиента '+E(p.max_per_customer):''}${p.required_product?' · товар: '+E(p.required_product_name||p.required_product)+' × '+E(p.min_quantity):''} · применений ${E(p.uses||0)}${p.max_uses?' / '+E(p.max_uses):''}<br>${p.start_date?'с '+E(p.start_date):'без начала'} · ${p.end_date?'по '+E(p.end_date):'без окончания'} · UTC</small></div>${badge(p.active?'Активна':'Выключена',p.active?'green':'gray')}<button class="ghost" data-action="promo-edit" data-id="${E(p.code)}">Изменить</button>${p.active?`<button class="ghost" data-action="promo-off" data-id="${E(p.code)}">Выключить</button>`:''}</div>`).join(''):'<div class="empty">Акций пока нет. Создайте первую.</div>'}</section>`}
function exportsView(){return title('Выгрузка данных','Сохраняйте информацию в удобном формате.')+`<div class="notice warn" style="margin-bottom:18px">Выгрузки содержат персональные данные. Храните файлы в безопасном месте и не отправляйте их посторонним. Максимум 5 000 записей на файл.</div><div class="export-grid">${[['orders','▤','Заказы','Номер, покупатель, телефон, доставка, оплата, статус и сумма.'],['products','◇','Товары и склад','Артикулы, категории, цены, остатки и доступность.'],['customers','♙','Клиенты','Имена, Telegram, телефон и дата регистрации.']].map(([k,i,t,d])=>`<div class="export-card"><div class="export-icon">${i}</div><h3>${t}</h3><p>${d}</p><a href="/admin/api/export?type=${k}" class="outline" download>⇩ Скачать CSV</a></div>`).join('')}</div><p class="muted" style="margin-top:20px">CSV в кодировке UTF-8, разделитель — точка с запятой. Файл можно открыть в Excel. Суммы заказов указаны без стоимости доставки.</p>`}

let analysisData=null,analysisMetric='net';
function analyticsView(){return title('Анализ продаж','ABC / XYZ · динамика спроса · данные о товарах')+`<div class="notice">Анализ по дате создания заказа, который сейчас имеет статусы «Доставлен» и «Оплачен». Цены товаров до скидок и баллов; показатель не является прибылью. Даты в UTC. Подсказки не учитывают себестоимость, сроки поставки и сезонность.</div><section class="card section-card"><form id="analysis-form" class="toolbar"><label class="form-label">С <input class="field" name="from" type="date" required value="${analysisData?E(analysisData.from):new Date(Date.now()-180*86400000).toISOString().slice(0,10)}"></label><label class="form-label">ПО <input class="field" name="to" type="date" required value="${analysisData?E(analysisData.to):new Date().toISOString().slice(0,10)}"></label><label class="form-label">ПОКАЗАТЕЛЬ ДИНАМИКИ <select class="select" name="metric"><option value="net" ${analysisMetric==='net'?'selected':''}>Денежная сумма товаров</option><option value="completed" ${analysisMetric==='completed'?'selected':''}>Оплачено и доставлено</option><option value="orders" ${analysisMetric==='orders'?'selected':''}>Созданные заказы</option></select></label><button class="primary">Рассчитать ↗</button></form><div id="analysis-result">${analysisData?analysisResult(analysisData):'<div class="empty">Выберите период и нажмите «Рассчитать».</div>'}</div></section>`}
function classifyProducts(d){
 const list=d.products||[],sum=list.reduce((a,p)=>a+Number(p.gross),0);let cumulative=0,months=[];let date=new Date(d.from.slice(0,7)+'-01T00:00:00Z'),end=d.to.slice(0,7);while(date.toISOString().slice(0,7)<=end){months.push(date.toISOString().slice(0,7));date.setUTCMonth(date.getUTCMonth()+1)}const complete=d.from.endsWith('-01')&&new Date(Date.parse(d.to+'T00:00:00Z')+86400000).getUTCDate()===1,enough=complete&&months.length>=3,map={};for(const m of (d.months||[])){(map[m.product_id]??={})[m.month]=Number(m.qty)}
 const values=list.map(p=>{const before=sum?cumulative/sum:0;cumulative+=Number(p.gross);const abc=before<.8?'A':before<.95?'B':'C',v=months.map(m=>(map[p.product_id]||{})[m]||0),mean=v.reduce((a,b)=>a+b,0)/v.length,cv=mean?Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/v.length)/mean:0;return {...p,abc,xyz:!enough?'—':cv<=.1?'X':cv<=.25?'Y':'Z',cv:enough?cv:null}});return {values,enough};
}
function analysisChart(d){
 const days=Math.round((Date.parse(d.to+'T00:00:00Z')-Date.parse(d.from+'T00:00:00Z'))/86400000)+1,monthly=days>90,byDay=new Map((d.daily||[]).map(x=>[x.day,x])),buckets=new Map();for(let i=0;i<days;i++){const date=new Date(Date.parse(d.from+'T00:00:00Z')+i*86400000).toISOString().slice(0,10),key=monthly?date.slice(0,7):date;buckets.set(key,(buckets.get(key)||0)+Number(byDay.get(date)?.[analysisMetric]||0))}const rows=[...buckets],max=Math.max(1,...rows.map(x=>x[1]));return `<div class="card-head"><div><h2 class="card-title">Динамика: ${E(({net:'денежная сумма товаров',completed:'оплачено и доставлено',orders:'созданные заказы'})[analysisMetric])}</h2><p class="card-note">${monthly?'По календарным месяцам':'По дням'} UTC; дни без заказов — ноль.</p></div></div><div class="table-wrap"><div class="chart" style="min-width:${Math.max(480,rows.length*28)}px">${rows.map(([label,v],i)=>`<div class="chart-col" title="${E(label)}: ${E(v)}"><div class="bar" style="height:${Math.round(v/max*150)}px"></div><div class="chart-label">${i%Math.max(1,Math.ceil(rows.length/12))===0?E(monthly?label:label.slice(5)):''}</div></div>`).join('')}</div></div>`;
}
function analysisDelta(now,old){now=Number(now||0);old=Number(old||0);return old===0?(now===0?'без изменений':'нет базы для процента'):(now>=old?'+':'')+((now-old)/old*100).toFixed(1)+'%'}
function exportABC(d){const info=classifyProducts(d),headers=['product_id','name','units','gross_before_discounts_rub','abc','xyz','cv_percent','stock_now'];const cell=v=>{if(typeof v==='number'&&Number.isFinite(v))return String(v);let x=String(v??'');if(/^[\s\x00-\x1f]*[=+@-]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};const rows=info.values.map(p=>[p.product_id,p.name,p.qty,p.gross,p.abc,p.xyz,p.cv==null?'':Number((p.cv*100).toFixed(2)),p.stock]);const csv='\uFEFF'+[headers,...rows].map(row=>row.map(cell).join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bioryx-abc-xyz-'+d.from+'-'+d.to+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function analysisResult(d){const {values,enough}=classifyProducts(d);let rows=values.map(p=>{let days=(Date.parse(d.to+'T00:00:00Z')-Date.parse(d.from+'T00:00:00Z'))/86400000+1,rate=Number(p.qty)/days,coverage=rate>0&&p.stock!=null?Number(p.stock)/rate:null;let hint=p.stock==null?'Товар отсутствует в каталоге':days<30||p.qty<3?'Недостаточно данных для ориентира по закупке':coverage<=14?'Остаток примерно на '+Math.ceil(coverage)+' дн. — проверить закупку и срок поставки':coverage>=90?'Остаток примерно на '+Math.ceil(coverage)+' дн. — проверить оборачиваемость и срок годности':'Остаток примерно на '+Math.ceil(coverage)+' дн. — сверить срок поставки';let pricing=p.current_cost==null?'Укажите себестоимость для оценки текущей цены':Number(p.current_cost)>=Number(p.current_price)?'Текущая цена не выше себестоимости — проверить повышение цены или закупку':Number(p.current_price)-Number(p.current_cost)<=Number(p.current_price)*.1?'Запас между ценой и себестоимостью ≤10% — проверить условия':'Недостаточно данных для рекомендации по изменению цены';return `<tr><td><b>${E(p.name)}</b><br><span class="muted">${E(p.product_id)}</span></td><td>${E(p.qty)}</td><td>${money(p.gross)}</td><td>${E(p.abc)} / ${E(p.xyz)}</td><td>${p.stock==null?'—':E(p.stock)}</td><td>${E(hint)}<br><span class="muted">${E(pricing)}</span></td></tr>`}).join('');let o=d.overview||{},financial=d.financial||{},known=Number(financial.complete||0),completed=Number(financial.completed||0);return `<div class="metrics"><div class="metric"><div class="metric-head">Все заказы периода</div><strong>${E(o.orders||0)}</strong></div><div class="metric"><div class="metric-head">Оплачены и доставлены</div><strong>${E(o.completed||0)}</strong></div><div class="metric"><div class="metric-head">Сумма к оплате товаров</div><strong>${money(o.net||0)}</strong><small>После скидок и баллов; без доставки</small></div><div class="metric"><div class="metric-head">Отменённые сейчас</div><strong>${E(o.cancelled||0)}</strong></div></div><div class="detail-block"><h3>Сравнение с предыдущим периодом той же длины</h3><p class="muted">${E(d.previousFrom||'—')} — ${E(d.previousTo||'—')} UTC. Статусы заказов берутся текущие, поэтому история сравнения может меняться.</p><p>Создано заказов: <b>${E(analysisDelta(o.orders,d.previous?.orders))}</b> · Оплачено и доставлено: <b>${E(analysisDelta(o.completed,d.previous?.completed))}</b> · Денежная сумма товаров: <b>${E(analysisDelta(o.net,d.previous?.net))}</b></p><p>Средний денежный чек за товары по оплаченным и доставленным: <b>${o.completed?money(Math.round(Number(o.net||0)/Number(o.completed))):'—'}</b> · Доля отменённых среди созданных: <b>${o.orders?(Number(o.cancelled||0)/Number(o.orders)*100).toFixed(1)+'%':'—'}</b></p></div><div class="detail-block">${analysisChart(d)}</div><div class="detail-block"><h3>Денежная часть за минусом себестоимости</h3><p>Заказы с полной себестоимостью: <b>${E(known)} из ${E(completed)}</b>. Денежная сумма товаров по ним: <b>${known?money(financial.known_net):'—'}</b>; себестоимость товаров и подарков: <b>${known?money(financial.known_cost):'—'}</b>; разница: <b>${known?money(Number(financial.known_net)-Number(financial.known_cost)):'—'}</b>.</p><p class="muted">Это не бухгалтерская прибыль и не результат всех заказов, если часть себестоимостей неизвестна. Не включены доставка, закупочные логистика и потери, эквайринг, налоги, прочие расходы, будущие обязательства по баллам и фактические возвраты. Дата создания заказа UTC; учитываются текущие отметки «оплачен» и «доставлен». Историческую себестоимость можно заполнить в карточке заказа.</p></div><p class="muted">ABC: доля оборота до скидок: A до 80%, B до 95%, C остаток; товар включается по доле до его добавления. XYZ: вариация количества по календарным месяцам: X ≤10%, Y ≤25%, Z выше. Для XYZ нужны ≥3 полных месяца; месяцы без продаж = 0. История продаж без остатка в каталоге тоже учитывается. Подсказка по запасу — текущий остаток / средние продажи в день за выбранный период; менее 30 дней или 3 продаж недостаточно. Ориентиры 14 и 90 дней условные, сезонность и сроки поставок не учтены. Сравнение цены использует текущие цену и себестоимость, без акций и иных расходов.</p>${!enough?'<div class="notice warn">XYZ не рассчитан: выберите не менее трёх полных календарных месяцев.</div>':''}<div class="toolbar"><button class="outline" data-action="abc-export">Скачать ABC / XYZ CSV ↓</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Товар</th><th>Продано, шт.</th><th>Оборот до скидок</th><th>ABC / XYZ</th><th>Остаток</th><th>Подсказка</th></tr></thead><tbody>${rows||'<tr><td colspan="6">Нет оплаченных и доставленных заказов за период.</td></tr>'}</tbody></table></div><p class="muted">Не меняйте цены по одному показателю: себестоимость может быть неполной, а конкуренты, расходы и фактические возвраты не учтены. Все результаты зависят от текущего состояния заказов и могут измениться.</p>`}
function clubView(){return title('Клуб и баллы','Настройки действующих четырёх уровней и списания', '<div class="toolbar"><button class="outline" data-action="audit" data-module="club">История условий</button><button class="outline" data-action="audit" data-module="sale">История распродаж</button></div>')+`<div class="notice warn">Изменения вступают в силу сразу: уровень пересчитывается по оплаченной сумме доставленных заказов, новые начисления и лимит применяются по актуальным правилам. Старые начисления автоматически не пересчитываются. Изменения цен не переписывают уже созданные заказы.</div><form id="club-form" class="stack" style="margin-top:16px">${(state.club?.levels||[]).map((x,i)=>`<section class="card"><div class="card-head"><div><h2 class="card-title">Уровень ${i+1}</h2><p class="card-note">Внутренний код ${E(x.id)}</p></div><span class="metric-icon">✦</span></div><div class="form-grid"><label class="form-label">НАЗВАНИЕ<input class="field" name="title-${E(x.id)}" maxlength="60" required value="${E(x.title)}"></label><label class="form-label">ПОРОГ ПОКУПОК, ₽<input class="field" name="threshold-${E(x.id)}" type="number" min="0" max="100000000" required value="${E(x.threshold)}" ${i===0?'readonly':''}></label><label class="form-label">КЭШБЭК, %<input class="field" name="cashback-${E(x.id)}" type="number" min="0" max="100" required value="${E(x.cashback)}"></label></div></section>`).join('')}<section class="card"><label class="form-label">МАКСИМАЛЬНАЯ ДОЛЯ ОПЛАТЫ ТОВАРОВ БАЛЛАМИ, %<input class="field" style="max-width:220px" name="redeem" type="number" min="0" max="100" required value="${E(state.club?.redeemPercent??100)}"></label><p class="muted">После применения промокода, без стоимости доставки. Первый порог — 0; остальные должны строго возрастать.</p><button class="primary">Сохранить условия ↗</button></section></form>`+clubSalesView()}

ale_price)} вместо ${money(x.price)} · ${E(x.start_date||'без начала')} — ${E(x.end_date||'без окончания')} UTC</small></div>${badge(x.active?(x.sale_price<x.price?'Включена':'Цена не действует'):'Выключена',x.active&&x.sale_price<x.price?'green':'gray')}<button class="ghost" data-action="sale-edit" data-product="${E(x.product_id)}" data-level="${E(x.level)}">Изменить</button></div>`).join('')||'<div class="empty">Распродаж пока нет.</div>'}</section>`}

function financeView(){let d=cashData,s=d?.summary||{},from=d?.from||localDate(new Date(Date.now()-29*86400000)),to=d?.to||localDate(new Date());return title('Денежные операции','Ручной журнал поступлений и расходов','<div class="toolbar"><button class="outline" data-action="audit" data-module="finance">История изменений</button><button class="primary" data-action="cash-new">+ Добавить операцию</button></div>')+`<div class="notice warn">Записи вводятся вручную и не переводят деньги. Отметка оплаты заказа не создаёт запись автоматически: сверяйте фактические операции с банком и кассой. Здесь нет начального остатка, движения СБП, складской прибыли и налогового учёта. Не добавляйте одну операцию дважды.</div><section class="card section-card"><form id="cash-range" class="toolbar"><label class="form-label">С <input class="field" type="date" name="from" value="${E(from)}" required></label><label class="form-label">ПО <input class="field" type="date" name="to" value="${E(to)}" required></label><button class="primary">Показать ↗</button></form>${d?`<div class="metrics"><div class="metric"><div class="metric-head">Поступления бизнеса</div><strong>${money(s.business_in||0)}</strong></div><div class="metric"><div class="metric-head">Расходы и возвраты</div><strong>${money(s.business_out||0)}</strong></div><div class="metric"><div class="metric-head">Взносы / изъятия владельца</div><strong>${money(s.owner_in||0)} / ${money(s.owner_out||0)}</strong></div><div class="metric"><div class="metric-head">Движение за период</div><strong>${money(Number(s.business_in||0)-Number(s.business_out||0)+Number(s.owner_in||0)-Number(s.owner_out||0))}</strong><small>Не баланс счёта и не прибыль</small></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Дата</th><th>Тип операции</th><th>Сумма</th><th>Примечание / заказ</th><th></th></tr></thead><tbody>${(d.rows||[]).map(x=>`<tr><td>${E(x.event_date)}</td><td>${E(cashLabels[x.kind]||x.kind)} ${x.voided?badge('Аннулирована','red'):''}</td><td>${cashPositive.has(x.kind)?'+':'−'} ${money(x.amount)}</td><td>${E(x.description||'—')}${x.order_id?'<br><span class="muted">Заказ '+E(x.order_id)+'</span>':''}</td><td><button class="ghost" data-action="cash-edit" data-id="${E(x.id)}">Изменить</button><button class="ghost" data-action="cash-toggle" data-id="${E(x.id)}">${x.voided?'Восстановить':'Аннулировать'}</button></td></tr>`).join('')||'<tr><td colspan="5">Операций за период нет.</td></tr>'}</tbody></table></div>${d.hasMore?'<div class="notice warn">Показаны первые 200 операций; суммы рассчитаны по всем записям периода. Сократите период или выгрузите CSV.</div>':''}`:'<div class="empty">Выберите период и нажмите «Показать».</div>'}</section>`}

a?.to||localDate(new Date()));notify('Операция сохранена; она может быть вне выбранного периода')}catch(err){notify(err.message)}finally{button.disabled=false}}}
function reportsView(){return title('Отчёты','Операционные отчёты и выгрузки CSV','<button class="outline" data-action="audit" data-module="cost">История себестоимости ↗</button>')+`<div class="notice warn">Отчёты используют UTC. Даты относятся к созданию заказа, статусы — текущие. Баллы группируются по дате операции. Остатки и баланс баллов — текущие, независимо от периода. В отчёте по покупателям first/repeat определяются только по привязанным оплаченным и доставленным заказам; unlinked — заказы без привязки, не количество людей. Журнал денежных операций — ручной, по введённой дате. Отчёт по скидкам включает только заказы с финансовой записью. Суммы не являются прибылью и не включают доставку. Не более 5000 строк на отчёт.</div><section class="card section-card"><h2 class="card-title">Скачать отчёт за период</h2><form id="report-form" class="form-grid" style="margin-top:18px"><label class="form-label">С <input class="field" name="from" type="date" required value="${new Date(Date.now()-90*86400000).toISOString().slice(0,10)}"></label><label class="form-label">ПО <input class="field" name="to" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="form-label wide">ТИП ОТЧЁТА <select class="select" name="type"><option value="daily">Заказы и продажи по дням</option><option value="products">Продажи по товарам</option><option value="promos">Применение промокодов</option><option value="points">Движение баллов</option><option value="fulfillment">Доставка, оплата и статусы</option><option value="stock">Текущие складские остатки</option><option value="costs">Денежная сумма и себестоимость заказов</option><option value="adjustments">Скидки, баллы и денежная сумма</option><option value="retention">Новые и повторные привязанные покупатели</option><option value="balances">Баланс баллов по уровням (сейчас)</option><option value="cashbook">Ручной журнал денежных операций</option></select></label><button class="primary wide">Скачать CSV ↗</button></form><p class="muted">Период не более 731 дня. Если строк больше 5000, сервер вернёт ошибку, а не неполный отчёт.</p></section><section class="card section-card"><h2 class="card-title">Исходные данные</h2><p class="card-note">Заказы, товары и клиенты; содержат персональные данные.</p><div class="toolbar" style="margin-top:16px"><a class="outline" href="/admin/api/export?type=orders">Заказы ↓</a><a class="outline" href="/admin/api/export?type=products">Товары ↓</a><a class="outline" href="/admin/api/export?type=customers">Клиенты ↓</a></div></section>`}

async function showAudit(module,before=''){
 const titles={promo:'История промокодов',sale:'История клубных цен',club:'История условий клуба',cost:'История себестоимости',finance:'История денежных операций'};if(!titles[module])return;
 const d=await api('config-audit?module='+encodeURIComponent(module)+(before?'&before='+encodeURIComponent(before):''));

 const describe=raw=>{if(!raw)return '—';try{return JSON.stringify(JSON.parse(raw),null,2)}catch{return raw}};

async function prepareProductImage(file,maxSide){
 if(!file)return null;if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>12*1024*1024)throw Error('Выберите JPEG, PNG или WebP размером до 12 МБ.');
 const url=URL.createObjectURL(file);let image;try{image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('Не удалось прочитать изображение.'));img.src=url});if(!image.naturalWidth||!image.naturalHeight||image.naturalWidth*image.naturalHeight>40000000)throw Error('Изображение слишком большое по размерам. Максимум 40 мегапикселей.');let scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));const ctx=canvas.getContext('2d');if(!ctx)throw Error('Браузер не поддерживает обработку изображений.');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);for(let quality of [.84,.74,.64,.54,.44]){let data=canvas.toDataURL('image/webp',quality);if(!data.startsWith('data:image/webp;'))data=canvas.toDataURL('image/jpeg',quality);if(data.length<=570000)return data}throw Error('Не удалось достаточно сжать фото. Выберите файл поменьше.')}finally{URL.revokeObjectURL(url)}
}

document.addEventListener('click',async e=>{let nav=e.target.closest('[data-nav],[data-go]');if(nav){navigate(nav.dataset.nav||nav.dataset.go);return}let b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;try{if(a==='cash-new')return cashForm();if(a==='cash-edit'){const e=(cashData?.rows||[]).find(x=>x.id===id);if(e)cashForm(e);return}if(a==='cash-toggle'){const e=(cashData?.rows||[]).find(x=>x.id===id);if(!e)return;if(!confirm(e.voided?'Восстановить операцию в итогах?':'Аннулировать операцию? Она останется в журнале.'))return;await api('cashbook','POST',{id:e.id,mode:'edit',version:e.version,date:e.event_date,kind:e.kind,amount:e.amount,description:e.description,orderId:e.order_id||'',voided:!e.voided});await loadCash(cashData.from,cashData.to);return notify('Операция обновлена')}if(a==='abc-export'){if(analysisData)exportABC(analysisData);return}if(a==='save-order-cost'){const input=$('cost-line-'+b.dataset.line);if(!input||!input.checkValidity())return notify('Проверьте себестоимость');const v=input.value===''?null:Number(input.value);await api('order-cost','POST',{orderId:id,lineId:Number(b.dataset.line),unitCost:v});await showOrder(id);return notify('Себестоимость сохранена')}if(a==='audit'||a==='audit-next')return await showAudit(b.dataset.module,a==='audit-next'?b.dataset.before:'');if(a==='order')return showOrder(id);if(a==='customer')return showCustomer(id);if(a==='product')return productForm(state.products.find(x=>x.id===id));if(a==='product-new')return productForm();if(a==='check-bot'){const d=await api('notification-health');const labels={pending:'в очереди',sending:'отправляется',sent:'отправлено',failed:'ошибка'};const count=(d.states||[]).map(x=>(labels[x.state]||x.state)+': '+x.n).join(' · ');$('bot-diagnostic').textContent=(d.bot?'Бот: @'+d.bot.username:(d.error||'Бот недоступен'))+' · '+(count||'очередь пуста');return}if(a==='retry-notification'){if(!confirm('Повторить отправку? В случае прежнего сбоя сообщени ent-state').value,send=$('notify-payment').checked;if(!confirm('Сохранить данные оплаты? Изменение отметки не выполняет перевод или возврат денег.'))return;const r=await api('payment','POST',{id,method,paymentStatus,notify:send});await loadAll();render();await showOrder(id);return notify(r.unchanged?'Данные не изменились':r.queued?'Оплата изменена · уведомление в очереди':send?'Оплата изменена · заказ не привязан к боту':'Данные оплаты изменены')}if(a==='change-status'){let next=$('next-status').value,send=$('notify-status').checked;if(next===currentOrderStatus)return notify('Этот статус уже установлен');if(!confirm('Изменить статус на «'+statuses[next]+'»? При отмене товары автоматически возвращаются на склад, даже если уже отправлены. Проверьте фактический возврат товаров и денег. Баллы могут быть пересчитаны, баланс может стать отрицательным.'))return;const r=await api('status','POST',{id,status:next,notify:send});await loadAll();render();await showOrder(id);return notify(r.queued?'Статус изменён · уведомление в очереди':send?'Статус изменён · заказ не привязан к боту':'Статус изменён')}}catch(err){notify(err.message)}});
